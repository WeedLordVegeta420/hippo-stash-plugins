name: Gallery Mode
description: Adds a gallery mode button to the video player toolbar for viewing a scene like a photo gallery. Pairs well with the SpriteTab plugin.
version: "1.0"
url: https://github.com/hippochapel/hippo-stash-plugins/tree/main/plugins/GalleryMode
ui:
  javascript:
    - gallery.js
settings:
  enabled:
    displayName: Enabled
    description: Enable gallery mode (intercepts sprite cell clicks in SpriteTab)
    type: BOOLEAN
  low_bandwidth_mode:
    displayName: Low Bandwidth Mode
    description: "When enabled, frames are extracted server-side via the frame server (requires the server to be running). When disabled (default), frames are extracted client-side from the video stream at native resolution."
    type: BOOLEAN
  show_debug_panel:
    displayName: Show Debug Panel
    description: Show the GalleryMode debug panel inside the overlay
    type: BOOLEAN
  gallery_prefetch_enabled:
    displayName: Prefetch Enabled
    description: Prefetch neighboring gallery frames in the background
    type: BOOLEAN
  gallery_prefetch_offsets_seconds:
    displayName: Prefetch Offsets
    description: "Comma-separated prefetch offsets in seconds, e.g. 0.5, 1, 5"
    type: STRING
  gallery_prefetch_window_seconds:
    displayName: Prefetch Window
    description: How far ahead/behind the current frame to prefetch (seconds)
    type: NUMBER
  frame_server_port:
    displayName: Frame Server Port
    description: Port for the local frame extraction server (default 9876)
    type: NUMBER
  frame_server_host:
    displayName: Frame Server Host
    description: "Hostname (and optional port) for the frame server. Overrides the default of using the current page hostname with frame_server_port."
    type: STRING
interface: raw
exec:
  - python3
  - "{pluginDir}/GalleryMode.py"
tasks:
  - name: Start Frame Server
    description: Spawns the frame extraction server as a detached background process. The task completes immediately; the server runs independently until stopped.
    execArgs:
      - start
  - name: Stop Frame Server
    description: Stops the background frame extraction server.
    execArgs:
      - stop
